
name: Update TrailerDrop

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Search for older trailers using the YouTube API"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: trailer-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run trailer updater
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill || false }}
        run: python update_trailers.py

      - name: Save updated trailer data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trailers.json
          if git diff --cached --quiet; then
            echo "No trailer data changes to save."
            exit 0
          fi
          git commit -m "Update trailer feed"
          git pull --rebase origin main
          git push origin main
