
name: Update TrailerDrop

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      backfill:
        description: "Search for older trailers using the YouTube API"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: trailer-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test TMDB API key
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "TMDB_API_KEY is missing or empty."
            exit 1
          fi

          STATUS=$(curl -sS \
            -o /dev/null \
            -w "%{http_code}" \
            --get \
            --data-urlencode "api_key=$TMDB_API_KEY" \
            "https://api.themoviedb.org/3/configuration")

          echo "TMDB API status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "TMDB API test failed."
            exit 1
          fi

          echo "TMDB API key test passed."

      - name: Run trailer updater
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill || false }}
        run: python update_trailers.py

      - name: Save updated trailer data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trailers.json

          if git diff --cached --quiet; then
            echo "No trailer data changes to save."
            exit 0
          fi

          git commit -m "Update trailer feed"
          git pull --rebase origin main
          git push origin main
