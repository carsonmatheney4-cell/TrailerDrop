
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10111a">
  <meta name="description" content="Discover eligible movie and gaming trailers on TrailerDrop.">
  <title>TrailerDrop — Movie & Gaming Trailers</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10111a;
      --panel: #191b28;
      --panel-hover: #222538;
      --text: #f5f6ff;
      --muted: #a5a9c1;
      --accent: #9b8cff;
      --border: #303349;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }

    header {
      padding: 30px 18px 22px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: #141522;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -1.5px;
    }

    h1 span { color: var(--accent); }

    header p {
      margin: 10px 0 0;
      color: var(--muted);
    }

    main {
      width: min(1200px, 100%);
      margin: auto;
      padding: 22px 16px 50px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    button, input {
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
    }

    input {
      flex: 1;
      min-width: 180px;
    }

    button { cursor: pointer; }

    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #10111a;
      font-weight: 700;
    }

    h2 {
      margin: 30px 0 15px;
      font-size: 1.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
      gap: 18px;
    }

    .card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      transition: transform .15s, background .15s;
    }

    .card:hover {
      transform: translateY(-3px);
      background: var(--panel-hover);
    }

    .thumbnail {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #25273a;
    }

    .card-content { padding: 14px; }

    .card h3 {
      margin: 0 0 10px;
      font-size: 1rem;
      line-height: 1.45;
    }

    .meta {
      color: var(--muted);
      font-size: .82rem;
      margin-bottom: 12px;
    }

    .watch {
      display: inline-block;
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    .watch:hover { text-decoration: underline; }

    .message {
      color: var(--muted);
      padding: 20px 0;
    }

    footer {
      padding: 24px 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      font-size: .85rem;
    }

    footer a { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover { transform: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Trailer<span>Drop</span></h1>
    <p>Your feed for movie and gaming trailers.</p>
  </header>

  <main>
    <div class="controls" aria-label="Trailer filters">
      <button class="active" data-category="All">All</button>
      <button data-category="Movie Trailers">Movies</button>
      <button data-category="Gaming">Gaming</button>
      <input id="search" type="search" placeholder="Search trailers..." aria-label="Search trailers">
    </div>

    <p id="status" class="message" role="status">Loading trailers...</p>
    <div id="results"></div>
  </main>

  <footer>
    TrailerDrop is an independent fan project. Movie data and ratings are
    provided through <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">TMDB</a>.
    This product uses the TMDB API but is not endorsed or certified by TMDB.
    <div id="updated" style="margin-top:8px"></div>
  </footer>

  <script>
    const ALLOWED_RATINGS = new Set(["G", "PG", "PG-13"]);
    const EXCLUDED_TERMS = [
      "reaction", "reactions", "reacts to", "reacting to",
      "trailer reaction", "review", "reviews", "movie review",
      "game review", "breakdown", "explained", "ending explained",
      "first time watching", "watch along", "commentary",
      "tier list", "ranking every", "honest review"
    ];

    let allVideos = [];
    let selectedCategory = "All";

    const results = document.getElementById("results");
    const status = document.getElementById("status");
    const search = document.getElementById("search");

    function isMovie(video) {
      const category = String(video.category || "").toLowerCase();
      return category.includes("movie") || category.includes("film");
    }

    function isExcluded(title) {
      const lower = String(title || "").toLowerCase();
      return EXCLUDED_TERMS.some(term => lower.includes(term));
    }

    function isEligible(video) {
      if (!video || !video.id || !video.title || isExcluded(video.title)) {
        return false;
      }

      // Movie ratings must have been confirmed by the collector.
      if (isMovie(video)) {
        return ALLOWED_RATINGS.has(String(video.rating || "").toUpperCase());
      }

      return true;
    }

    function safeYouTubeUrl(video) {
      // Construct the watch URL from a validated YouTube video ID.
      if (!/^[A-Za-z0-9_-]{11}$/.test(video.id)) return "";
      return `https://www.youtube.com/watch?v=${video.id}`;
    }

    function makeCard(video) {
      const article = document.createElement("article");
      article.className = "card";

      const link = safeYouTubeUrl(video);
      if (!link) return null;

      const image = document.createElement("img");
      image.className = "thumbnail";
      image.src = `https://i.ytimg.com/vi/${video.id}/hqdefault.jpg`;
      image.alt = "";
      image.loading = "lazy";
      image.onerror = () => {
        image.style.display = "none";
      };

      const content = document.createElement("div");
      content.className = "card-content";

      const heading = document.createElement("h3");
      heading.textContent = video.title;

      const meta = document.createElement("div");
      meta.className = "meta";
      const details = [video.category || "Trailer"];
      if (isMovie(video)) details.push(video.rating);
      if (video.published) {
        const date = new Date(video.published);
        if (!Number.isNaN(date.getTime())) {
          details.push(date.toLocaleDateString());
        }
      }
      meta.textContent = details.join(" · ");

      const watch = document.createElement("a");
      watch.className = "watch";
      watch.href = link;
      watch.target = "_blank";
      watch.rel = "noopener noreferrer";
      watch.textContent = "Watch trailer ↗";

      content.append(heading, meta, watch);
      article.append(image, content);
      return article;
    }

    function render() {
      const term = search.value.trim().toLowerCase();

      const filtered = allVideos.filter(video => {
        if (!isEligible(video)) return false;

        const category = isMovie(video) ? "Movie Trailers" : video.category;
        if (selectedCategory !== "All" && category !== selectedCategory) {
          return false;
        }

        return video.title.toLowerCase().includes(term);
      });

      results.replaceChildren();

      if (!filtered.length) {
        status.textContent = allVideos.length
          ? "No trailers match those filters."
          : "No eligible trailers are available yet.";
        return;
      }

      status.textContent = `${filtered.length} trailer${filtered.length === 1 ? "" : "s"}`;

      const groups = [
        { title: "Movie Trailers", videos: filtered.filter(isMovie) },
        { title: "Gaming", videos: filtered.filter(video => !isMovie(video)) }
      ];

      for (const group of groups) {
        if (!group.videos.length) continue;

        const section = document.createElement("section");
        const heading = document.createElement("h2");
        heading.textContent = group.title;

        const grid = document.createElement("div");
        grid.className = "grid";

        for (const video of group.videos) {
          const card = makeCard(video);
          if (card) grid.append(card);
        }

        section.append(heading, grid);
        results.append(section);
      }
    }

    async function loadTrailers() {
      try {
        const response = await fetch("./trailers.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        allVideos = Array.isArray(data.videos)
          ? data.videos.filter(isEligible)
          : [];

        if (data.updated) {
          const date = new Date(data.updated);
          document.getElementById("updated").textContent =
            Number.isNaN(date.getTime())
              ? ""
              : `Feed last updated: ${date.toLocaleString()}`;
        }

        render();
      } catch (error) {
        console.error("Could not load trailers:", error);
        status.textContent =
          "Couldn't load trailers. Please try again later.";
      }
    }

    document.querySelectorAll("button[data-category]").forEach(button => {
      button.addEventListener("click", () => {
        selectedCategory = button.dataset.category;
        document.querySelectorAll("button[data-category]").forEach(item => {
          item.classList.toggle("active", item === button);
        });
        render();
      });
    });

    search.addEventListener("input", render);
    loadTrailers();
  </script>
</body>
</html>
